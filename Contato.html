<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Brechópolis</title>
    <link rel="stylesheet" href="Contato.css">
</head>
<body>
    <section class="text">
        <h1>BRECHÓPOLIS</h1>
        <p><strong>MODA CONSCIENTE, ACHADOS INCRÍVEIS E ESTILO <br> <span>ÚNICO EM CADA DETALHE</strong></p>
    </section>

    <section class="contato">
        <div class="formlario">
            <h2>Formulario</h2>
            <form action="index.html">
            <input type="text" placeholder="Nome" required> <br>
            <input type="password" placeholder="Senha"> <br>
            <input type="email" placeholder="E-mail" required> <br>
            <input type="submit" placeholder="Enviar" class="env">
            </form>
        </div>

        <nav class="formas">
            <div class="botao">
                <img src="whatsapp-brands-solid-full (1).svg" alt="" style="width: 15vh;">
            <a href="">Whatsapp</a>
            </div>
            <div class="botao">
                <img src="google-brands-solid-full (1).svg" alt="" style="width: 15vh;">
            <a href="">Email</a>
            </div>
            <div class="botao">
                <img src="instagram-brands-solid-full (1).svg" alt="" style="width: 15vh;">
            <a href="">Instagram</a>
            </div>
        </nav>
    </section>
</body>
</html>
