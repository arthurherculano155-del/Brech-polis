<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjuntos - Brechópolis</title>
    <link rel="stylesheet" href="conj1.css">
</head>
<body>
    <section class="oi">
        <div class="pai">
        <img src="Roupa.png" alt="" style="width: 25vw;">
    <h2>Urban Eclipse Set</h2>
    <p id="Tung"> R$ 182,09</p>
    </div>
        <div class="pai">
        <img src="Roupa2.png" alt="" style="width: 25vw;">
    <h2>Mosshadow Motion</h2>
    <p id="Tung"> R$ 190,90</p>
    </div>
        <div class="pai">
        <img src="Roupa3.png" alt="" style="width: 25vw;">
    <h2>Shadow Motion Set</h2>
    <p id="Tung"> R$ 150,00</p>
    </div>
    </section>

    <div class="calcular">
        <h2>Parcelar em quantas vezes?</h2>
        <input type="text" id="Conj" placeholder="Nome do conjunto"> <br>
        <input type="text" id="Parcelas" placeholder="Quantidade de parcelas" required> <br>
        <button onclick="resultado()">Calcular</button>
        <p id="Res"></p>
    </div>
    
    <script>
        function resultado(){
            let n1;
            let n2 = Number(document.getElementById("Parcelas").value);

            

            let conj = document.getElementById("Conj").value.toLowerCase();

            if(conj.toLowerCase() === "urban eclipse set"){
                n1 = 182.09;
                let a = calculo(n1, n2);
            }else if(conj.toLowerCase() === "mosshadow motion"){
                n1 = 190.90;
                let a = calculo(n1, n2);
            } else if(conj.toLowerCase() === "shadow motion set"){
                n1 = 150.00;
                let a = calculo(n1, n2);
            } 
            else{
            document.getElementById("Res").innerText = "Conjunto não encontrado"
        }
        }


        function calculo(n1, n2){
        let result = n1 / n2;
            if(n2 === 0){
            document.getElementById("Res").innerText = `R$ ${n1.toFixed(2)}`;
            } else if(n2 < 0){
            document.getElementById("Res").innerText = "INSIRA UM NÚMERO NATURAL"
            } else if(n2 > 10){
                document.getElementById("Res").innerText = "O número máximo de parcelas permitido é 10."
            }
            
            else{
            document.getElementById("Res").innerText = `Parcelado em ${n2}x de\nR$ ${(result).toFixed(2)}`;
            }
            return result;
        }
    </script>
</body>
</html>
