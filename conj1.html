    <div class="calcular">
        <h2>Parcelar em quantas vezes?</h2>
        <input type="text" id="Parcelas" placeholder="Quantidade de parcelas"> <br>
        <button onclick="resultado()">Calcular</button>
        <p id="Res"></p>
    </div>
    <script>
        function resultado(){
            let n1= Number(182.09);
            let n2 = Number(document.getElementById("Parcelas").value)

            let result = n1 / n2;

            if(n2 === 0){
                document.getElementById("Res").innerText = `R$ ${n1.toFixed(2)}`;
            } else{
                document.getElementById("Res").innerText = `R$ ${(result).toFixed(2)}`;
            }
        }
    </script>
